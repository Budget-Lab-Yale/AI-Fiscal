# Central parameter file for AI fiscal simulation (v1.0 release build).
#
# This file is the single source of truth for every tunable parameter.
# Every leaf parameter carries two metadata siblings:
#   <param>_status: one of (sourced | preliminary | derived | choice)
#   <param>_source: short citation or pointer to a calibration receipt.
#
# Status taxonomy:
#   sourced     — pinned from primary source; safe to publish.
#   preliminary — anchored to data/literature, but verify against source
#                 before publishing.
#   derived     — computed in code from other parameters; included on the
#                 parameter_index sheet for traceability.
#   choice      — run-time knob (no calibration concept).
#
# The publishable .xlsx bundle (results/aggregates/ai_fiscal_publishable_*.xlsx)
# auto-generates a parameter_index sheet plus calibration_receipts sheets
# from this file on every run.
#
# code/02_params.R::load_params() validates that every required key
# below is present and aborts with a list of any gaps.

baseline_year: 2030
baseline_year_status: choice
baseline_year_source: "Match Karger 5-yr horizon; microsim aged to 2030."

# ---------------------------------------------------------------------
# CBO baseline real-GDP growth path (publication 62105: 2025 = 1.9%,
# 2026 = 2.2%, 2027+ = 1.8% flat). The Tax-Simulator aging pipeline
# grows the PUF/SCF microsim to baseline_year along this same path, so
# tax_units_<baseline_year>.csv is the no-AI level. g_y (derived in
# code/02_params.R) is the multiplicative AI bump applied on top.
# ---------------------------------------------------------------------
cbo_baseline:
  horizon_start_year: 2025
  horizon_start_year_status: choice
  horizon_start_year_source: "Karger 2026 (NBER w35046) 5-yr horizon base."

  g_2026: 0.022
  g_2026_status: sourced
  g_2026_source: "CBO February 2026 Budget and Economic Outlook: 2026 to 2036 (publication 62105), Table 1, real GDP growth for 2026."

  g_2027plus: 0.018
  g_2027plus_status: sourced
  g_2027plus_source: "CBO February 2026 Budget and Economic Outlook: 2026 to 2036 (publication 62105), Table 1, real GDP growth for 2027 and onward (held flat at 1.8%/yr)."

  gdp_baseline_year_B: 37391
  gdp_baseline_year_B_status: sourced
  gdp_baseline_year_B_source: "CBO February 2026 Budget and Economic Outlook: 2026 to 2036 (publication 62105), 2030 nominal GDP."

  rev_to_gdp_baseline_year: 0.176381
  rev_to_gdp_baseline_year_status: sourced
  rev_to_gdp_baseline_year_source: "CBO February 2026 Budget and Economic Outlook: 2026 to 2036 (publication 62105), Table 1-1 data supplement (www.cbo.gov/publication/61882), FY2030 total revenues $6,594.999B / GDP $37,390.67B. v1.0.0 used the rounded report figure 17.7%; corrected in v1.0.1."

  cit_to_gdp_baseline_year: 0.0127663
  cit_to_gdp_baseline_year_status: sourced
  cit_to_gdp_baseline_year_source: "CBO February 2026 Budget and Economic Outlook: 2026 to 2036 (publication 62105), Table 1-1 data supplement (www.cbo.gov/publication/61882), FY2030 corporate income taxes $477.340B / GDP $37,390.67B. v1.0.0 used the rounded report figure 1.3% ($486.1B); corrected in v1.0.1."

  # Baseline growth path the AI bump g_y is measured against (Version 1.2
  # rung 1, A1). flat: g_2026 in the first horizon year, then g_2027plus
  # (v1.0.1). annual: CBO's calendar-year real GDP path in path_file.
  growth_path: flat
  growth_path_status: choice
  growth_path_source: "docs/v1_2_plan.md A1. flat reproduces v1.0.1; annual is the Version 1.2 reference."

  path_file: calibration/cbo_2026_02_baseline_path.csv
  path_file_status: sourced
  path_file_source: "CBO February 2026 baseline, calendar years 2025-2036 (Economic-Projections.xlsx, sheet 2; the source of Macro-Projections vintage 2026071916). Built by code/12_baseline_receipts.R. Relative to config/."

# ---------------------------------------------------------------------
# Shock targets — Karger et al. 2026 (NBER w35046), 5-yr horizon to
# baseline_year.
#   theta1_k     = post-shock capital share = 1 - (post-shock labor share)
#   r_ai_annual  = median 2030 annualized GDP growth rate under AI
#
# Variant codes S / M / R map to Karger Slow / Moderate / Rapid. The
# release pipeline always loops over all three variants.
# ---------------------------------------------------------------------
shock:
  baseline_labor_share: 0.555
  baseline_labor_share_status: sourced
  baseline_labor_share_source: "Karger 2026 (NBER w35046) Sec. 3, 2025 nonfarm-business labor share baseline (55.48%), rounded."

  # What the survey's 2030 labor share is compared with (rung 1, A1).
  # survey_2025: the 2025 share above (v1.0.1). projected: the 2025 share
  # moved by the CBO baseline's drift in compensation / GDP from 2025 to
  # baseline_year (cbo_baseline.path_file), so drift the baseline already
  # projects is not attributed to AI.
  share_baseline: survey_2025
  share_baseline_status: choice
  share_baseline_source: "docs/v1_2_plan.md A1. CBO projects no nonfarm-business labor share; economy-wide compensation / GDP is the proxy for its drift."

  # Where the survey's shock lands (rung 1, A2). whole_economy: the share
  # change and g_y apply to all factor income (v1.0.1). nonfarm_business:
  # both apply within nonfarm business only; other sectors keep their
  # baseline income and labor share (sector_file).
  sector: whole_economy
  sector_status: choice
  sector_source: "docs/v1_2_plan.md A2 and decision 1. Karger's labor share is the BLS nonfarm-business series (PRS85006173)."

  sector_file: calibration/nipa_sector_gva_2025.csv
  sector_file_status: sourced
  sector_file_source: "BEA NIPA 2025: gross value added by sector (Table 1.3.5) and compensation of employees outside nonfarm business (Tables 1.13, 6.2D). Built by code/12_baseline_receipts.R. Relative to config/."

  variants:
    S:                          # Slow:     2030 labor 55.0%; AI GDP CAGR 2.0%/yr (Economists)
      theta1_k: 0.450
      theta1_k_status: sourced
      theta1_k_source: "1 - Karger Table 39 2030 labor share for Slow, Economists column, median (55.0%)."
      r_ai_annual: 0.020
      r_ai_annual_status: sourced
      r_ai_annual_source: "Karger 2026 (NBER w35046) Table 19, Slow scenario, Economists column, median 2030 annualized GDP growth rate."
    M:                          # Moderate: 2030 labor 54.0%; AI GDP CAGR 2.6%/yr (Economists)
      theta1_k: 0.460
      theta1_k_status: sourced
      theta1_k_source: "1 - Karger Table 39 2030 labor share for Moderate, Economists column, median (54.0%). v1.0.0 used the Total column (53.8%); corrected in v1.0.1."
      r_ai_annual: 0.026
      r_ai_annual_status: sourced
      r_ai_annual_source: "Karger 2026 (NBER w35046) Table 19, Moderate scenario, Economists column, median 2030 annualized GDP growth rate."
    R:                          # Rapid:    2030 labor 52.0%; AI GDP CAGR 3.3%/yr (Economists)
      theta1_k: 0.480
      theta1_k_status: sourced
      theta1_k_source: "1 - Karger Table 39 2030 labor share for Rapid, Economists column, median (52.0%). v1.0.0 used the Total column (51.3%); corrected in v1.0.1."
      r_ai_annual: 0.033
      r_ai_annual_status: sourced
      r_ai_annual_source: "Karger 2026 (NBER w35046) Table 19, Rapid scenario, Economists column, median 2030 annualized GDP growth rate."

# ---------------------------------------------------------------------
# Magnitude of the S2/S3 dispersion shift, tied to the productivity
# shock g_y. The release pipeline loops over labor scenarios {S0, S2,
# S3}; this scalar controls the S2/S3 bite.
#   lambda_S2 = 1 - k * g_y   (compressive)
#   lambda_S3 = 1 + k * g_y   (expansive)
# k = 1 is the literal proportional-to-g_y mapping. Aborts at run time
# if lambda <= 0.
# ---------------------------------------------------------------------
labor_inequality:
  k: 1.0
  k_status: preliminary
  k_source: "Literal proportional-to-g_y mapping; see docs/k_calibration_memo.md. Sensitivity range [0.5, 2]."

# ---------------------------------------------------------------------
# Passthrough labor / capital split (Saez and Zucman (2020)). At each
# tax unit, partition active S-corp / partnership profit at the wage
# threshold W*; treat passive profit separately. Labor share absorbed
# into the per-unit labor income y_l; capital share into y_k. SZ apply W* directly at the
# tax-unit level, so no owner-manager n-bar adjustment is applied.
# ---------------------------------------------------------------------
passthrough:
  wage_threshold_percentile: 99.99
  wage_threshold_percentile_status: preliminary
  wage_threshold_percentile_source: "Saez and Zucman (2020) active-profit split, tax-unit-level threshold."

  wage_threshold_conditioning: positive_wages
  wage_threshold_conditioning_status: choice
  wage_threshold_conditioning_source: "'positive_wages' matches the W-2 universe per SZ."

  active_below_capital_share: 0.25
  active_below_capital_share_status: preliminary
  active_below_capital_share_source: "Saez and Zucman (2020): 25% of below-W* active profit -> capital."

  active_above_capital_share: 0.75
  active_above_capital_share_status: preliminary
  active_above_capital_share_source: "Saez and Zucman (2020): 75% of above-W* active profit -> capital."

  passive_capital_share: 0.75
  passive_capital_share_status: preliminary
  passive_capital_share_source: "Saez and Zucman (2020): 75% of passive profit -> capital."

# ---------------------------------------------------------------------
# Corporate leakage (Step D, macro bolt-on).
# Corporate tax operates upstream of household realizations. The AI CIT
# delta is pinned by calibrating a single scale factor eta against the
# CBO baseline-year CIT level:
#
#   eta := tau_cit * (Y0_K$ * kappa_corp) /
#          (cbo_baseline.cit_to_gdp_baseline_year * gdp_baseline_year_B$)
#   delta_R_CIT = tau_cit * kappa_corp * X / eta
#
# eta absorbs both the household-realized-vs-pre-realization wedge and
# the statutory-vs-effective gap. Algebraically delta_R_CIT / X =
# CBO_CIT_baseline / Y0_K$, where Y0_K$ is aggregate baseline capital
# income (sum of weight * y_k). The full X flows to households.
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# Routing of the AI capital flow X within a tax unit (Version 1.2 rung 2,
# B3). by_holdings: X_i is split over equities, bonds, pass-throughs, and
# retirement by holdings, so bonds carry part of it as interest (v1.0.1).
# baseline_path: interest stays on its baseline path and the bond slice
# goes to the other classes; X keeps its dollar size (decision 2). Rent
# and estate income never receive X (no real-estate class).
# ---------------------------------------------------------------------
capital_flow:
  interest: by_holdings
  interest_status: choice
  interest_source: "docs/v1_2_plan.md B3 and decision 2. by_holdings reproduces v1.0.1."

corporate:
  kappa_corp: 0.50
  kappa_corp_status: preliminary
  kappa_corp_source: "NIPA 2024 Z.1 F.3 narrow C-corp share (S-corps stripped from numerator). See calibration_receipts_kappa_corp sheet. Sensitivity [0.45, 0.65]."

  cit_statutory: 0.21
  cit_statutory_status: sourced
  cit_statutory_source: "TCJA federal C-corp rate (IRC §11)."
