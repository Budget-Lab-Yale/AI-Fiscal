# Version 1.2 reference setting (docs/v1_2_plan.md).
#
# An overlay on config/scenario_params.yaml, which holds every key at its
# v1.0.1 value (the legacy_v1_0_1 setting, which has no overlay file). List
# only the keys Version 1.2 changes, nested as in the base yaml, each leaf
# with its _status / _source siblings and a _rung tag naming the rung that
# introduced it, e.g.
#
#   shock:
#     baseline_labor_share: <value>
#     baseline_labor_share_status: sourced
#     baseline_labor_share_source: "..."
#     baseline_labor_share_rung: 1
#
# Rung 0 changed no keys.

window: annual
window_status: choice
window_source: "Decision 3: tax years 2025-2036, reporting FY2026 (nowcast) and FY2027-2036."
window_rung: 4

cbo_baseline:
  growth_path: annual
  growth_path_status: choice
  growth_path_source: "docs/v1_2_plan.md A1: CBO's annual real GDP path rather than the Table 1 rounded rates."
  growth_path_rung: 1

# shock.share_baseline stays survey_2025 (no drift): CBO's production
# function holds the nonfarm-business factor shares constant, and the
# projected alternative is a sensitivity (decided 2026-10-28).
shock:
  sector: nonfarm_business
  sector_status: choice
  sector_source: "docs/v1_2_plan.md A2, decision 1 (SET 2026-10-28): share change and excess growth within nonfarm business only."
  sector_rung: 1

  # After 2030 Karger's growth and labor share move together, as the joint
  # prediction they are: both in straight lines to the survey's 2050 values.
  # hold_gap (the 2030 pair held) is now a sensitivity (decided 2026-10-29).
  post_2030: to_2050
  post_2030_status: choice
  post_2030_source: "Decided 2026-10-29 (John): the AI growth rate and the nonfarm-business labor share move jointly to Karger's 2050 values (online appendix Tables 20 and 40); holding the 2030 gap is a sensitivity."
  post_2030_rung: 4

capital_flow:
  allocation_base: ex_home_cash_nonfin
  allocation_base_status: choice
  allocation_base_source: "Decided 2026-10-28: the primary residence, cash, and other nonfinancial assets (vehicles, OTHNFIN) earn none of the AI capital flow."
  allocation_base_rung: 2

  residual: spread
  residual_status: choice
  residual_source: "Decided 2026-10-28: units with no income-bearing holdings receive none of X; their share is spread over units that have such holdings."
  residual_rung: 4

  interest: baseline_path
  interest_status: choice
  interest_source: "docs/v1_2_plan.md B3, decision 2 (SET 2026-10-28): interest on its baseline path; X keeps its dollar size."
  interest_rung: 2
