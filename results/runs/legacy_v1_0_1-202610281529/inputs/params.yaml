baseline_year: 2030
baseline_year_status: choice
baseline_year_source: Match Karger 5-yr horizon; microsim aged to 2030.
cbo_baseline:
  horizon_start_year: 2025
  horizon_start_year_status: choice
  horizon_start_year_source: Karger 2026 (NBER w35046) 5-yr horizon base.
  g_2026: 0.022
  g_2026_status: sourced
  g_2026_source: 'CBO February 2026 Budget and Economic Outlook: 2026 to 2036 (publication
    62105), Table 1, real GDP growth for 2026.'
  g_2027plus: 0.018
  g_2027plus_status: sourced
  g_2027plus_source: 'CBO February 2026 Budget and Economic Outlook: 2026 to 2036
    (publication 62105), Table 1, real GDP growth for 2027 and onward (held flat at
    1.8%/yr).'
  gdp_baseline_year_B: 37391
  gdp_baseline_year_B_status: sourced
  gdp_baseline_year_B_source: 'CBO February 2026 Budget and Economic Outlook: 2026
    to 2036 (publication 62105), 2030 nominal GDP.'
  rev_to_gdp_baseline_year: 0.176381
  rev_to_gdp_baseline_year_status: sourced
  rev_to_gdp_baseline_year_source: 'CBO February 2026 Budget and Economic Outlook:
    2026 to 2036 (publication 62105), Table 1-1 data supplement (www.cbo.gov/publication/61882),
    FY2030 total revenues $6,594.999B / GDP $37,390.67B. v1.0.0 used the rounded report
    figure 17.7%; corrected in v1.0.1.'
  cit_to_gdp_baseline_year: 0.0127663
  cit_to_gdp_baseline_year_status: sourced
  cit_to_gdp_baseline_year_source: 'CBO February 2026 Budget and Economic Outlook:
    2026 to 2036 (publication 62105), Table 1-1 data supplement (www.cbo.gov/publication/61882),
    FY2030 corporate income taxes $477.340B / GDP $37,390.67B. v1.0.0 used the rounded
    report figure 1.3% ($486.1B); corrected in v1.0.1.'
shock:
  baseline_labor_share: 0.555
  baseline_labor_share_status: sourced
  baseline_labor_share_source: Karger 2026 (NBER w35046) Sec. 3, 2025 nonfarm-business
    labor share baseline (55.48%), rounded.
  variants:
    S:
      theta1_k: 0.45
      theta1_k_status: sourced
      theta1_k_source: 1 - Karger Table 39 2030 labor share for Slow, Economists column,
        median (55.0%).
      r_ai_annual: 0.02
      r_ai_annual_status: sourced
      r_ai_annual_source: Karger 2026 (NBER w35046) Table 19, Slow scenario, Economists
        column, median 2030 annualized GDP growth rate.
    M:
      theta1_k: 0.46
      theta1_k_status: sourced
      theta1_k_source: 1 - Karger Table 39 2030 labor share for Moderate, Economists
        column, median (54.0%). v1.0.0 used the Total column (53.8%); corrected in
        v1.0.1.
      r_ai_annual: 0.026
      r_ai_annual_status: sourced
      r_ai_annual_source: Karger 2026 (NBER w35046) Table 19, Moderate scenario, Economists
        column, median 2030 annualized GDP growth rate.
    R:
      theta1_k: 0.48
      theta1_k_status: sourced
      theta1_k_source: 1 - Karger Table 39 2030 labor share for Rapid, Economists
        column, median (52.0%). v1.0.0 used the Total column (51.3%); corrected in
        v1.0.1.
      r_ai_annual: 0.033
      r_ai_annual_status: sourced
      r_ai_annual_source: Karger 2026 (NBER w35046) Table 19, Rapid scenario, Economists
        column, median 2030 annualized GDP growth rate.
labor_inequality:
  k: 1.0
  k_status: preliminary
  k_source: Literal proportional-to-g_y mapping; see docs/k_calibration_memo.md. Sensitivity
    range [0.5, 2].
passthrough:
  wage_threshold_percentile: 99.99
  wage_threshold_percentile_status: preliminary
  wage_threshold_percentile_source: Saez and Zucman (2020) active-profit split, tax-unit-level
    threshold.
  wage_threshold_conditioning: positive_wages
  wage_threshold_conditioning_status: choice
  wage_threshold_conditioning_source: '''positive_wages'' matches the W-2 universe
    per SZ.'
  active_below_capital_share: 0.25
  active_below_capital_share_status: preliminary
  active_below_capital_share_source: 'Saez and Zucman (2020): 25% of below-W* active
    profit -> capital.'
  active_above_capital_share: 0.75
  active_above_capital_share_status: preliminary
  active_above_capital_share_source: 'Saez and Zucman (2020): 75% of above-W* active
    profit -> capital.'
  passive_capital_share: 0.75
  passive_capital_share_status: preliminary
  passive_capital_share_source: 'Saez and Zucman (2020): 75% of passive profit ->
    capital.'
corporate:
  kappa_corp: 0.5
  kappa_corp_status: preliminary
  kappa_corp_source: NIPA 2024 Z.1 F.3 narrow C-corp share (S-corps stripped from
    numerator). See calibration_receipts_kappa_corp sheet. Sensitivity [0.45, 0.65].
  cit_statutory: 0.21
  cit_statutory_status: sourced
  cit_statutory_source: TCJA federal C-corp rate (IRC §11).
