baseline_year: 2030
baseline_year_status: choice
baseline_year_source: Match Karger 5-yr horizon; microsim aged to 2030.
window: annual
window_status: choice
window_source: 'Decision 3: tax years 2025-2036, reporting FY2026 (nowcast) and FY2027-2036.'
window_first_year: 2025
window_first_year_status: choice
window_first_year_source: 'Decision 3: the survey''s base year, dropped by Tax-Simulator''s
  fiscal-year adjustment.'
window_last_year: 2036
window_last_year_status: choice
window_last_year_source: 'Decision 3: last year of CBO''s February 2026 budget window.'
cbo_baseline:
  horizon_start_year: 2025
  horizon_start_year_status: choice
  horizon_start_year_source: Karger 2026 (NBER w35046) 5-yr horizon base.
  g_2026: 0.022
  g_2026_status: sourced
  g_2026_source: 'CBO February 2026 Budget and Economic Outlook: 2026 to 2036 (publication
    62105), Table 1, real GDP growth for 2026.'
  g_2027plus: 0.018
  g_2027plus_status: sourced
  g_2027plus_source: 'CBO February 2026 Budget and Economic Outlook: 2026 to 2036
    (publication 62105), Table 1, real GDP growth for 2027 and onward (held flat at
    1.8%/yr).'
  gdp_baseline_year_B: 37391
  gdp_baseline_year_B_status: sourced
  gdp_baseline_year_B_source: 'CBO February 2026 Budget and Economic Outlook: 2026
    to 2036 (publication 62105), 2030 nominal GDP.'
  rev_to_gdp_baseline_year: 0.176381
  rev_to_gdp_baseline_year_status: sourced
  rev_to_gdp_baseline_year_source: 'CBO February 2026 Budget and Economic Outlook:
    2026 to 2036 (publication 62105), Table 1-1 data supplement (www.cbo.gov/publication/61882),
    FY2030 total revenues $6,594.999B / GDP $37,390.67B. v1.0.0 used the rounded report
    figure 17.7%; corrected in v1.0.1.'
  cit_to_gdp_baseline_year: 0.0127663
  cit_to_gdp_baseline_year_status: sourced
  cit_to_gdp_baseline_year_source: 'CBO February 2026 Budget and Economic Outlook:
    2026 to 2036 (publication 62105), Table 1-1 data supplement (www.cbo.gov/publication/61882),
    FY2030 corporate income taxes $477.340B / GDP $37,390.67B. v1.0.0 used the rounded
    report figure 1.3% ($486.1B); corrected in v1.0.1.'
  growth_path: annual
  growth_path_status: choice
  growth_path_source: 'docs/v1_2_plan.md A1: CBO''s annual real GDP path rather than
    the Table 1 rounded rates.'
  budget_path_file: calibration/cbo_2026_02_budget_path.csv
  budget_path_file_status: sourced
  budget_path_file_source: 'CBO February 2026 baseline, fiscal years 2025-2036: GDP
    and revenues by source (Budget-Projections.xlsx, Table 1-1). The CBO anchors for
    each year of an annual window (GDP, revenue / GDP, corporate receipts / GDP).
    Built by code/12_baseline_receipts.R. Relative to config/.'
  path_file: calibration/cbo_2026_02_baseline_path.csv
  path_file_status: sourced
  path_file_source: CBO February 2026 baseline, calendar years 2025-2036 (Economic-Projections.xlsx,
    sheet 2; the source of Macro-Projections vintage 2026071916). Built by code/12_baseline_receipts.R.
    Relative to config/.
shock:
  baseline_labor_share: 0.555
  baseline_labor_share_status: sourced
  baseline_labor_share_source: Karger 2026 (NBER w35046) Sec. 3, 2025 nonfarm-business
    labor share baseline (55.48%), rounded.
  post_2030: to_2050
  post_2030_status: choice
  post_2030_source: 'Decided 2026-10-29 (John): the AI growth rate and the nonfarm-business
    labor share move jointly to Karger''s 2050 values (online appendix Tables 20 and
    40); holding the 2030 gap is a sensitivity.'
  share_baseline: survey_2025
  share_baseline_status: choice
  share_baseline_source: docs/v1_2_plan.md A1. CBO projects no nonfarm-business labor
    share; economy-wide compensation / GDP is the proxy for its drift.
  sector: nonfarm_business
  sector_status: choice
  sector_source: 'docs/v1_2_plan.md A2, decision 1 (SET 2026-10-28): share change
    and excess growth within nonfarm business only.'
  sector_file: calibration/nipa_sector_gva_2025.csv
  sector_file_status: sourced
  sector_file_source: 'BEA NIPA 2025: gross value added by sector (Table 1.3.5) and
    compensation of employees outside nonfarm business (Tables 1.13, 6.2D). Built
    by code/12_baseline_receipts.R. Relative to config/.'
  variants:
    S:
      theta1_k: 0.45
      theta1_k_status: sourced
      theta1_k_source: 1 - Karger Table 39 2030 labor share for Slow, Economists column,
        median (55.0%).
      r_ai_annual: 0.02
      r_ai_annual_status: sourced
      r_ai_annual_source: Karger 2026 (NBER w35046) Table 19, Slow scenario, Economists
        column, median 2030 annualized GDP growth rate.
      theta1_k_2050: 0.48
      theta1_k_2050_status: sourced
      theta1_k_2050_source: 1 - Karger 2026 online appendix Table 40 (p. 132), 2050
        nonfarm-business labor share for Slow, Economists column, median (52.0%).
        Used only when shock.post_2030 = to_2050.
      r_ai_annual_2050: 0.02
      r_ai_annual_2050_status: sourced
      r_ai_annual_2050_source: Karger 2026 online appendix Table 20 (p. 89), Slow,
        Economists column, median annualized GDP growth over the five years to 2050
        (2.0%). Used only when shock.post_2030 = to_2050.
    M:
      theta1_k: 0.46
      theta1_k_status: sourced
      theta1_k_source: 1 - Karger Table 39 2030 labor share for Moderate, Economists
        column, median (54.0%). v1.0.0 used the Total column (53.8%); corrected in
        v1.0.1.
      r_ai_annual: 0.026
      r_ai_annual_status: sourced
      r_ai_annual_source: Karger 2026 (NBER w35046) Table 19, Moderate scenario, Economists
        column, median 2030 annualized GDP growth rate.
      theta1_k_2050: 0.5
      theta1_k_2050_status: sourced
      theta1_k_2050_source: 1 - Karger 2026 online appendix Table 40 (p. 132), 2050
        nonfarm-business labor share for Moderate, Economists column, median (50.0%).
        Used only when shock.post_2030 = to_2050.
      r_ai_annual_2050: 0.028
      r_ai_annual_2050_status: sourced
      r_ai_annual_2050_source: Karger 2026 online appendix Table 20 (p. 89), Moderate,
        Economists column, median annualized GDP growth over the five years to 2050
        (2.8%). Used only when shock.post_2030 = to_2050.
    R:
      theta1_k: 0.48
      theta1_k_status: sourced
      theta1_k_source: 1 - Karger Table 39 2030 labor share for Rapid, Economists
        column, median (52.0%). v1.0.0 used the Total column (51.3%); corrected in
        v1.0.1.
      r_ai_annual: 0.033
      r_ai_annual_status: sourced
      r_ai_annual_source: Karger 2026 (NBER w35046) Table 19, Rapid scenario, Economists
        column, median 2030 annualized GDP growth rate.
      theta1_k_2050: 0.55
      theta1_k_2050_status: sourced
      theta1_k_2050_source: 1 - Karger 2026 online appendix Table 40 (p. 132), 2050
        nonfarm-business labor share for Rapid, Economists column, median (45.0%).
        Used only when shock.post_2030 = to_2050.
      r_ai_annual_2050: 0.035
      r_ai_annual_2050_status: sourced
      r_ai_annual_2050_source: Karger 2026 online appendix Table 20 (p. 89), Rapid,
        Economists column, median annualized GDP growth over the five years to 2050
        (3.5%). Used only when shock.post_2030 = to_2050.
