  active_above_capital_share: 0.75
  active_above_capital_share_status: preliminary
  active_above_capital_share_source: 'Saez and Zucman (2020): 75% of above-W* active
    profit -> capital.'
  passive_capital_share: 0.75
  passive_capital_share_status: preliminary
  passive_capital_share_source: 'Saez and Zucman (2020): 75% of passive profit ->
    capital.'
capital_flow:
  allocation_base: ex_home_cash_nonfin
  allocation_base_status: choice
  allocation_base_source: 'Decided 2026-10-28: the primary residence, cash, and other
    nonfinancial assets (vehicles, OTHNFIN) earn none of the AI capital flow.'
  interest: baseline_path
  interest_status: choice
  interest_source: 'docs/v1_2_plan.md B3, decision 2 (SET 2026-10-28): interest on
    its baseline path; X keeps its dollar size.'
  residual: spread
  residual_status: choice
  residual_source: 'Decided 2026-10-28: units with no income-bearing holdings receive
    none of X; their share is spread over units that have such holdings.'
  retirement_flow: distributed
  retirement_flow_status: choice
  retirement_flow_source: docs/v1_2_plan.md rung 4 (retirement step, decided 2026-10-28).
  allocator: proportional
  allocator_status: choice
  allocator_source: 'docs/v1_2_plan.md C2 and decision 4: proportional is the reference;
    concentrating is a sensitivity paired with ai_gains_realized < 1.'
  concentration_top1: 0.514
  concentration_top1_status: derived
  concentration_top1_source: 'Fed Distributional Financial Accounts 2025Q4: top 1%
    hold 50% of corporate equities and mutual funds and 53% of private businesses
    (decision 4), weighted by the vintage''s 2030 equities ($46.8T) and pass-through
    holdings ($38.6T).'
  concentration_top01: 0.258
  concentration_top01_status: derived
  concentration_top01_source: 'Fed Distributional Financial Accounts 2025Q4: top 0.1%
    hold 24% of corporate equities and mutual funds and 28% of private businesses
    (decision 4), weighted as for concentration_top1.'
  payout: 0.3
  payout_status: preliminary
  payout_source: v1.0.1 value (formerly the public_equity_taxable rows of config/asset_to_income_map.csv).
    D7 (payout on a matched universe) is open.
  ai_gains_realized: 1
  ai_gains_realized_status: choice
  ai_gains_realized_source: 'docs/v1_2_plan.md C1 and decision 4: 1 (v1.0.1 and reference);
    sensitivities 0.75, 0.5, 0.25 with the concentrating allocator.'
